name: Windows desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build the unsigned NSIS artifact and SHA-256 checksum"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0
  PNPM_VERSION: 11.19.0
  RUST_TOOLCHAIN: stable-x86_64-pc-windows-msvc

jobs:
  desktop-ci:
    name: Windows checks and PR desktop gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: pnpm check

      - name: Acquire pinned official Node 24 runtime
        shell: pwsh
        run: .\scripts\acquire-node-runtime.ps1 -ReplaceExisting

      - name: Stage deterministic desktop runtime
        shell: pwsh
        run: .\scripts\stage-desktop-runtime.ps1 -ReplaceExisting

      - name: Run post-stage security checks
        run: pnpm test:security

      - name: Run desktop contract tests
        run: |
          pnpm test:desktop-package
          pnpm test:model-selector-layout
          pnpm test:desktop-contract

      - name: Check repository diff whitespace
        run: git diff --check

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust desktop host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check optional autostart feature
        run: cargo check --manifest-path src-tauri/Cargo.toml --features autostart

      - name: Run Rust desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri source gate without bundling
        run: pnpm exec tauri build --no-bundle

  desktop-release:
    name: Unsigned NSIS artifact (tag or manual dispatch)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    needs: desktop-ci
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: pnpm check

      - name: Acquire pinned official Node 24 runtime
        shell: pwsh
        run: .\scripts\acquire-node-runtime.ps1 -ReplaceExisting

      - name: Stage deterministic desktop runtime
        shell: pwsh
        run: .\scripts\stage-desktop-runtime.ps1 -ReplaceExisting

      - name: Verify the staged runtime security contract
        run: |
          pnpm test:security
          pnpm test:desktop-package
          pnpm test:model-selector-layout
          pnpm test:desktop-contract

      - name: Check repository diff whitespace
        run: git diff --check

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust desktop host and optional autostart feature
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml --features autostart

      - name: Run Rust desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS bundle
        run: pnpm exec tauri build --bundles nsis

      - name: Collect and verify the NSIS checksum
        shell: pwsh
        run: |
          function Get-Sha256Hex([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            try {
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try {
                return ([BitConverter]::ToString($sha256.ComputeHash($stream))).Replace("-", "").ToLowerInvariant()
              } finally {
                $sha256.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
          }

          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle\nsis"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "desktop-release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $nsisFiles = @(Get-ChildItem -LiteralPath $bundleDir -Filter "RWANG_*_x64-setup.exe" -File -ErrorAction SilentlyContinue)
          if ($nsisFiles.Count -ne 1) {
            throw "Expected exactly one RWANG_*_x64-setup.exe in $bundleDir; found $($nsisFiles.Count)"
          }

          $sourceInstaller = $nsisFiles[0]
          $destination = Join-Path $artifactDir $sourceInstaller.Name
          Copy-Item -LiteralPath $sourceInstaller.FullName -Destination $destination -Force
          $sourceHash = Get-Sha256Hex $sourceInstaller.FullName
          $copiedHash = Get-Sha256Hex $destination
          if ($copiedHash -ne $sourceHash) {
            throw "Copied NSIS installer SHA-256 does not match the built artifact"
          }

          $checksumLine = "$copiedHash  $($sourceInstaller.Name)"
          $checksumPath = Join-Path $artifactDir "SHA256SUMS.txt"
          Set-Content -LiteralPath $checksumPath -Value $checksumLine -Encoding ascii
          $recordedChecksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($recordedChecksum -ne $checksumLine) {
            throw "SHA256SUMS.txt does not exactly match the copied installer"
          }
          Write-Warning "No signing secret or signing step is configured. NSIS artifacts are unsigned and must not be treated as production releases."

      - name: Upload NSIS artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RWANG-desktop-${{ github.ref_name }}
          path: |
            desktop-release-artifacts/RWANG_*_x64-setup.exe
            desktop-release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
